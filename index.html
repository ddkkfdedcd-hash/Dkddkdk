<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شەوی کریسمس 🎄❤️</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",Tahoma,sans-serif;
}

body{
  background:
    radial-gradient(circle at 50% 15%,rgba(96,165,250,.18),transparent 32%),
    radial-gradient(circle at 20% 80%,rgba(244,63,94,.15),transparent 30%),
    linear-gradient(180deg,#020617 0%,#0f172a 45%,#1e1b4b 100%);
  color:#f8fafc;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  padding:20px;
  position:relative;
}

/* 🌙 هەلال */
.moon{
  position:absolute;
  top:6%;
  left:10%;
  font-size:70px;
  filter:drop-shadow(0 0 25px rgba(255,255,255,.6));
  animation:moonGlow 4s ease-in-out infinite;
  z-index:1;
}

@keyframes moonGlow{
  0%,100%{transform:scale(1);opacity:.8}
  50%{transform:scale(1.1);opacity:1}
}

/* ✨ ئەستێرەکان */
.stars{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:0;
}

.star{
  position:absolute;
  color:#fde68a;
  font-size:14px;
  text-shadow:0 0 12px #fbbf24;
  animation:twinkle 3s ease-in-out infinite;
}

@keyframes twinkle{
  0%,100%{opacity:.25;transform:scale(.8)}
  50%{opacity:1;transform:scale(1.3)}
}

/* ❄️ بەفر */
.snowflake{
  position:fixed;
  top:-30px;
  color:white;
  user-select:none;
  pointer-events:none;
  z-index:10;
  animation:fall linear forwards;
  text-shadow:0 0 8px rgba(255,255,255,.8);
}

@keyframes fall{
  0%{
    transform:translateY(-30px) rotate(0deg);
    opacity:.1;
  }
  10%{opacity:.9}
  100%{
    transform:translateY(110vh) rotate(360deg);
    opacity:.15;
  }
}

/* 🎄 کارت */
.romance-card{
  position:relative;
  z-index:5;
  width:min(430px,100%);
  padding:35px 25px;
  text-align:center;

  background:
    linear-gradient(
      145deg,
      rgba(51,65,85,.82),
      rgba(30,27,75,.78)
    );

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  border:2px solid rgba(251,191,36,.25);
  border-radius:35px;

  box-shadow:
    0 25px 70px rgba(0,0,0,.85),
    0 0 35px rgba(244,63,94,.18),
    inset 0 0 35px rgba(255,255,255,.03);
}

/* 🔥 ڕووناکی ژێر کارت */
.romance-card::after{
  content:"";
  position:absolute;
  width:180px;
  height:60px;
  bottom:-30px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(251,191,36,.22);
  filter:blur(30px);
  border-radius:50%;
  z-index:-1;
}

/* 🎄 دار */
.tree{
  font-size:75px;
  margin-bottom:5px;
  animation:treeMove 3s ease-in-out infinite;
  filter:drop-shadow(0 0 18px rgba(34,197,94,.35));
}

@keyframes treeMove{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-7px)}
}

/* چرای دار */
.lights{
  font-size:18px;
  letter-spacing:7px;
  margin-bottom:12px;
  animation:lightPulse 2s infinite;
}

@keyframes lightPulse{
  0%,100%{opacity:.55}
  50%{opacity:1;text-shadow:0 0 15px #fbbf24}
}

h1{
  font-size:30px;
  margin-bottom:10px;
  background:linear-gradient(90deg,#fde68a,#fff,#fda4af);
  -webkit-background-clip:text;
  color:transparent;
  text-shadow:0 0 25px rgba(251,191,36,.15);
}

.subtitle{
  color:#cbd5e1;
  line-height:1.9;
  font-size:15px;
  margin-bottom:25px;
}

/* ❤️ دڵ */
.heart{
  font-size:45px;
  display:inline-block;
  animation:heartbeat 1.4s infinite;
  filter:drop-shadow(0 0 15px rgba(244,63,94,.7));
}

@keyframes heartbeat{
  0%,100%{transform:scale(1)}
  15%{transform:scale(1.2)}
  30%{transform:scale(1)}
  45%{transform:scale(1.15)}
}

/* ⏳ Countdown */
.countdown{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin:20px 0;
}

.time-box{
  padding:12px 5px;
  border-radius:16px;
  background:rgba(15,23,42,.6);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:inset 0 0 15px rgba(255,255,255,.02);
}

.time-box span{
  display:block;
  font-size:23px;
  font-weight:bold;
  color:#fde68a;
}

.time-box small{
  color:#94a3b8;
  font-size:11px;
}

/* 💌 پەیام */
.message{
  margin-top:20px;
  padding:18px;
  border-radius:20px;
  background:rgba(244,63,94,.08);
  border:1px solid rgba(244,63,94,.18);
  line-height:2;
  color:#f8fafc;
}

/* 🎁 دوگمە */
button{
  margin-top:20px;
  padding:13px 25px;
  border:none;
  border-radius:30px;
  cursor:pointer;
  color:white;
  font-size:15px;
  background:linear-gradient(135deg,#be123c,#7c3aed);
  box-shadow:0 8px 25px rgba(190,18,60,.3);
  transition:.3s;
}

button:hover{
  transform:translateY(-3px) scale(1.03);
  box-shadow:0 12px 30px rgba(190,18,60,.45);
}

/* 🕯️ چرای گەرم */
.candle{
  position:absolute;
  bottom:25px;
  right:25px;
  font-size:30px;
  filter:drop-shadow(0 0 15px #f59e0b);
  animation:candleGlow 2s infinite;
}

@keyframes candleGlow{
  0%,100%{filter:drop-shadow(0 0 8px #f59e0b)}
  50%{filter:drop-shadow(0 0 25px #fbbf24)}
}

/* ❤️ دڵە فڕێدراوەکان */
.floating-heart{
  position:fixed;
  bottom:-30px;
  color:#fb7185;
  font-size:20px;
  pointer-events:none;
  z-index:20;
  animation:floatHeart 5s linear forwards;
}

@keyframes floatHeart{
  0%{
    transform:translateY(0) scale(.6);
    opacity:0;
  }
  15%{opacity:1}
  100%{
    transform:translateY(-110vh) translateX(50px) scale(1.4);
    opacity:0;
  }
}

/* 📱 مۆبایل */
@media(max-width:500px){
  .moon{
    font-size:50px;
    left:5%;
    top:4%;
  }

  .romance-card{
    padding:28px 18px;
  }

  h1{
    font-size:25px;
  }

  .tree{
    font-size:65px;
  }

  .countdown{
    gap:5px;
  }

  .time-box span{
    font-size:19px;
  }
}
</style>
</head>

<body>

<div class="moon">🌙</div>

<div class="stars">
  <div class="star" style="top:10%;right:15%">✦</div>
  <div class="star" style="top:22%;right:30%">✧</div>
  <div class="star" style="top:35%;left:15%">✦</div>
  <div class="star" style="top:55%;right:10%">✧</div>
  <div class="star" style="top:70%;left:8%">✦</div>
  <div class="star" style="top:80%;right:25%">✧</div>
  <div class="star" style="top:15%;left:40%">✨</div>
</div>

<div class="romance-card">

  <div class="tree">🎄</div>

  <div class="lights">
    🟡 🔴 🟢 ✨ 🔵 🟡 🔴
  </div>

  <div class="heart">❤️</div>

  <h1>شەوی کریسمسی خۆش 🎄</h1>

  <div class="subtitle">
    شەوێک پڕ لە بەفر، ڕووناکی و خۆشەویستی... ❄️✨
    <br>
    با ئەم کریسمسە ببێتە بیرەوەرییەکی جوان ❤️
  </div>

  <div class="countdown">
    <div class="time-box">
      <span id="days">00</span>
      <small>ڕۆژ</small>
    </div>

    <div class="time-box">
      <span id="hours">00</span>
      <small>کاتژمێر</small>
    </div>

    <div class="time-box">
      <span id="minutes">00</span>
      <small>خولەک</small>
    </div>

    <div class="time-box">
      <span id="seconds">00</span>
      <small>چرکە</small>
    </div>
  </div>

  <div class="message">
    ❄️ لە دەرەوە بەفر دەبارێت،
    <br>
    🎄 چرای کریسمس دەدرەوشێتەوە،
    <br>
    ❤️ و دڵێک هەیە کە تەنها ئارەزووی خۆشی دەکات.
  </div>

  <button onclick="createHearts()">
    💖 پەیامی خۆشەویستی
  </button>

</div>

<div class="candle">🕯️</div>

<script>

/* ❄️ دروستکردنی بەفر */
function createSnow(){
  const snow=document.createElement("div");
  snow.className="snowflake";

  const symbols=["❄","❅","❆","•"];
  snow.innerHTML=symbols[Math.floor(Math.random()*symbols.length)];

  snow.style.left=Math.random()*100+"vw";
  snow.style.fontSize=(8+Math.random()*15)+"px";
  snow.style.animationDuration=(5+Math.random()*8)+"s";
  snow.style.opacity=.3+Math.random()*.7;

  document.body.appendChild(snow);

  setTimeout(()=>{
    snow.remove();
  },14000);
}

setInterval(createSnow,180);


/* ⏳ Countdown بۆ کریسمس */
function updateCountdown(){

  const now=new Date();

  let year=now.getFullYear();

  let christmas=new Date(year,11,25,0,0,0);

  if(now>christmas){
    christmas=new Date(year+1,11,25,0,0,0);
  }

  const difference=christmas-now;

  const days=Math.floor(difference/(1000*60*60*24));
  const hours=Math.floor(
    (difference/(1000*60*60))%24
  );
  const minutes=Math.floor(
    (difference/(1000*60))%60
  );
  const seconds=Math.floor(
    (difference/1000)%60
  );

  document.getElementById("days").textContent=
    String(days).padStart(2,"0");

  document.getElementById("hours").textContent=
    String(hours).padStart(2,"0");

  document.getElementById("minutes").textContent=
    String(minutes).padStart(2,"0");

  document.getElementById("seconds").textContent=
    String(seconds).padStart(2,"0");
}

updateCountdown();
setInterval(updateCountdown,1000);


/* ❤️ دڵە فڕێدراوەکان */
function createHeart(){

  const heart=document.createElement("div");

  heart.className="floating-heart";
  heart.innerHTML=
    ["❤️","💖","💕","💗","💘"]
    [Math.floor(Math.random()*5)];

  heart.style.left=Math.random()*100+"vw";
  heart.style.fontSize=(15+Math.random()*25)+"px";
  heart.style.animationDuration=(4+Math.random()*4)+"s";

  document.body.appendChild(heart);

  setTimeout(()=>{
    heart.remove();
  },8000);
}

setInterval(createHeart,900);


/* 💖 کلیک لەسەر دوگمە */
function createHearts(){

  for(let i=0;i<18;i++){

    setTimeout(()=>{
      createHeart();
    },i*120);

  }

  const button=document.querySelector("button");

  button.innerHTML="🎄 کریسمسی خۆش ❤️";

  setTimeout(()=>{
    button.innerHTML="💖 پەیامی خۆشەویستی";
  },2500);
}

</script>

</body<audio id="mySong" autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
    // بۆ دڵنیابوون لەوەی مۆسیقاکە خۆکار کار دەکات
    document.addEventListener("click", function() {
        var audio = document.getElementById("mySong");
        audio.play();
    });
</script>
>
</html>
